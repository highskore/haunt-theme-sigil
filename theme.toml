# The card's artwork, drawn by Haunt from these layers (docs/themes.md, "Layers").

# A second, darker rule just above the title bar's.
[[layer]]
id = "titlebar-rule2"
slot = "titlebar"
  [[layer.draw]]
  kind = "rect"
  y = "bottom"
  h = 1
  dy = -2
  fill = "@app.titlebar.rule2"

# ── ◇ Label ─────: a short rule, a diamond, the label ([app] label.indent leaves it room), a rule fading out.
[[layer]]
